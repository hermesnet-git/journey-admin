app:
  logging:
    include-payload: true
  connector-test:
    # Os conectores testados localmente (ms-mock-api-rest, ms-transform-publication etc.) rodam em
    # localhost — a proteção SSRF (REQ-03.10.003) bloquearia todo teste aqui, então fica desligada
    # só neste profile. Em qa/prod continua ligada (default true).
    block-private-networks: false
  transform-publication:
    # host/porta do serviço de publicação do runtime; sobrescrevível via env var
    # TRANSFORM_PUBLICATION_BASE_URL (ex.: em docker-compose, apontar para o hostname do serviço).
    base-url: ${TRANSFORM_PUBLICATION_BASE_URL:http://localhost:8082}
  runtime-engine:
    # engine-rest do motor de runtime, usado pelo Dashboard pra ler o estado ao vivo de
    # processos/instâncias/tarefas/incidentes — leitura direta, sem passar pelo ms-espec-registry
    # (que é específico da funcionalidade de Execução).
    base-url: ${RUNTIME_ENGINE_BASE_URL:http://localhost:8080/engine-rest}
  espec-registry:
    # o admin-back nunca fala com o broker nem com o Key Vault diretamente — o teste de conexão do
    # catálogo (FT-14, US-14.04) é delegado ao ms-espec-registry, o único componente que resolve
    # credencial e abre conexão de verdade.
    base-url: ${ESPEC_REGISTRY_BASE_URL:http://localhost:8083}
