server:
  port: 8081

spring:
  application:
    name: admin-back
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/journey_admin
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  cors:
    allowed-origins: http://localhost:5173
  security:
    session-inactivity-minutes: 30
  logging:
    include-payload: false

# Protótipo (FT-03 "gerar fluxo por prompt"): chave de serviço, nunca por usuário. "provider"
# escolhe qual dos dois adapters (AnthropicFlowGenerator/GeminiFlowGenerator) fica ativo.
ai:
  provider: gemini

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: claude-opus-5

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: gemini-3.5-flash-lite
