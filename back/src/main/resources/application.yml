server:
  port: 8081

spring:
  application:
    name: admin-back
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/journey_admin
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  cors:
    allowed-origins: http://localhost:5173
  security:
    session-inactivity-minutes: 30
  logging:
    include-payload: false

# Protótipo (FT-03 "gerar fluxo por prompt"). A chave de API em si não mora mais aqui — é
# configurada pela tela Integrações > Credencial de IA e lida do banco a cada chamada
# (GeminiFlowGenerator/AiProviderCredentialRepository), não mais de config estática. "model" segue
# aqui por não ser segredo.
gemini:
  model: gemini-3.5-flash-lite
