server:
  port: 8081

spring:
  application:
    name: admin-back
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/journey_admin
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  cors:
    allowed-origins: http://localhost:5173
  security:
    session-inactivity-minutes: 30
  logging:
    include-payload: false
