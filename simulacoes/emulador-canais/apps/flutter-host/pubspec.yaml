name: elastic_journey_flutter_host
description: Canal Flutter Web e Mobile de referência do Elastic Journey.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  elastic_journey_client:
    path: ../../packages/journey-client-dart
  elastic_journey_sdui_runtime:
    path: ../../packages/sdui-runtime-dart
  elastic_journey_renderer_flutter_mistica:
    path: ../../packages/renderer-flutter-mistica
  http: ^1.6.0
  url_launcher: ^6.3.2
  web: ^1.1.1

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
