server:
  port: 8083

spring:
  application:
    name: ms-espec-registry
  datasource:
    # Mesmo Postgres do admin/back (journey_admin) — leitura direta de journey_publication/
    # journey_version (schema public, do admin: sem escrita nem migração aqui). O schema
    # espec_registry, das telas publicadas, é deste serviço e migrado pelo FlywayMigrationInitializer.
    url: jdbc:postgresql://localhost:5432/journey_admin
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

app:
  cors:
    # Chamado agora pela aba "Simulações" do admin/front, não mais pelo simulador-front standalone.
    allowed-origins: http://localhost:5173
