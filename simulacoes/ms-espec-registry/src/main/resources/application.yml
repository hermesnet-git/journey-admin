server:
  port: 8083

spring:
  application:
    name: ms-espec-registry

app:
  camunda:
    base-url: http://localhost:8080/engine-rest
  kafka:
    bootstrap-servers: localhost:9092
  admin-back:
    base-url: http://localhost:8081
    service-username: admin
    service-password: admin
  strapi:
    base-url: http://localhost:1337
    # Sem default de propósito — gerar manualmente no admin do Strapi (Settings > API Tokens,
    # leitura+escrita em sdui-snapshot) e setar via env var antes de publicar/ler snapshots.
    api-token: ${STRAPI_API_TOKEN:}
  cors:
    # Chamado agora pela aba "Simulações" do admin/front, não mais pelo simulador-front standalone.
    allowed-origins: http://localhost:5173
