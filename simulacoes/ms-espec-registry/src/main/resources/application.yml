server:
  port: 8083

spring:
  application:
    name: ms-espec-registry
  datasource:
    # Mesmo Postgres do admin/back (journey_admin) — leitura direta de journey_publication/
    # journey_version, sem HTTP: o espec-registry não é dono desse schema, por isso não roda
    # migração nenhuma aqui (ddl-auto: none, sem Flyway).
    url: jdbc:postgresql://localhost:5432/journey_admin
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

app:
  strapi:
    base-url: http://localhost:1337
    # Sem default de propósito — gerar manualmente no admin do Strapi (Settings > API Tokens,
    # leitura+escrita em sdui-snapshot) e setar via env var antes de publicar/ler snapshots.
    api-token: ${STRAPI_API_TOKEN:}
  cors:
    # Chamado agora pela aba "Simulações" do admin/front, não mais pelo simulador-front standalone.
    allowed-origins: http://localhost:5173
