server:
  port: 8084
  error:
    include-message: always

spring:
  application:
    name: ms-mock-api-rest
  datasource:
    url: jdbc:h2:file:./data/mockapi
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
